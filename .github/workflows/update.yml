name: 데이터 자동 갱신

on:
  schedule:
    # 매일 한국시간 07:40 (UTC 22:40): 미국 장 마감 뒤 종가·배당 반영
    - cron: "40 22 * * *"
    # 매일 한국시간 09:40 (UTC 00:40): JEPQ 전용 자료가 원본 저장소에서 갱신된 뒤 한 번 더
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tickers.json"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 종목별 자료 수집
        run: python scripts/collect.py

      - name: JEPQ 전용 자료 받기
        if: always()
        run: python scripts/sync_jepq.py

      - name: 바뀐 데이터 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신 ($(TZ=Asia/Seoul date '+%F %H:%M'))"
            git pull --rebase --quiet
            git push
          fi
